# Default configuration. Override with --config mine.yaml or CLI flags.

ingest:
  # Higher resolution means more cropping headroom. 1080p is the sweet spot.
  max_height: 1080
  # Sections allow processing part of a long video, e.g. "*0:00-10:00"
  download_sections: null

transcribe:
  model: large-v3          # tiny|base|small|medium|large-v3|distil-large-v3
  device: auto             # auto|cuda|cpu
  compute_type: auto       # auto -> float16 on CUDA, int8 on CPU
  language: null           # null = auto-detect
  vad_filter: true         # trims silence, prevents hallucinations

scenes:
  # Lower threshold means more cuts detected. Fast-cut material needs a low one.
  threshold: 27.0
  min_scene_len: 0.4       # seconds

audio:
  # Window for the RMS envelope. Smaller reacts faster to short screams.
  window: 0.25             # seconds
  peak_percentile: 90      # percentile above which a window counts as a peak

select:
  # 0 = as many clips as the material supports. A fixed number caps it.
  clips: 0
  # Score floor. With an unlimited clip count this is the only quality brake -
  # without it every unremarkable window ends up in the render.
  min_score: 45
  # Hard bounds, not suggestions: a clip that cannot be placed inside this
  # range is dropped rather than shipped short or long.
  min_duration: 60.0
  max_duration: 90.0
  model: claude-opus-5
  effort: high
  # Language of title, hook and caption - the text shown in the video and under
  # the post. Independent of the language of the source material.
  output_language: en
  # Number of keyframes sent to the model as images (visual understanding).
  # 0 = transcript + energy + shots only (cheaper, worse on action content).
  vision_frames: 24

reframe:
  target_width: 1080
  target_height: 1920
  # Sampling rate for subject detection. 4 fps is enough and fast.
  sample_fps: 4.0
  # Minimum size for a face before the crop follows it - frame area share times
  # detection score. Without this threshold the crop also follows people far in
  # the background and misses the actual scene. Measured: real subjects sit at a
  # median of 0.005, background below 0.001.
  #
  # The crop is always static within a shot. When no face clears the threshold,
  # the fallback chain is: motion centroid -> previous shot's position -> centre.
  min_face_weight: 0.001

captions:
  enabled: true
  font: Arial Black
  font_size: 96
  primary_color: "&H00FFFFFF"    # ASS format: &HAABBGGRR
  highlight_color: "&H0000F0FF"  # active word (yellow)
  outline: 6
  shadow: 2
  margin_v: 420                  # distance from the bottom edge, in pixels
  # How many words are on screen at once. This is the leading constraint; the
  # character values below only act as an overflow guard so a long word does not
  # run off the frame.
  max_words: 4
  # At font size 96 in Arial Black roughly 22 characters fit across the frame.
  # Longer on-screen time therefore comes from the second line, not from wider
  # lines - 20 leaves some safety margin.
  max_chars_per_line: 20
  max_lines: 2
  # Speech pause that starts a new block. Without it a line would sit dead on
  # screen through a long silence.
  max_gap: 0.6
  uppercase: true
  strip_punctuation: true
  pop: true                      # briefly scale up the active word

  hook:
    enabled: true
    duration: 2.0                # seconds, from the clip start
    font_size: 110
    color: "&H00FFFFFF"
    outline: 7
    margin_v: 300                # distance from the TOP edge
    max_chars_per_line: 18
    max_lines: 3
    uppercase: true

silence:
  # Dead-air removal: cut speech pauses out of the finished clip. Turn off with
  # --no-silence, or here.
  enabled: true
  # Only a gap between two transcribed words counts, and only from this length.
  # Below that it is breathing, not a pause.
  min_gap: 0.6
  # Kept on each side of the gap, so the cut does not land on the last syllable.
  padding: 0.12
  # Normalised loudness ceiling for a gap to count as empty. This is the check
  # that carries the feature: on reaction content most word gaps are full of
  # music, crowd noise or an explosion, and cutting on the transcript alone
  # would delete exactly the moments the clip was picked for. Measured on 14
  # minutes of source: 160 gaps over 0.6s, only ~40% of them actually quiet.
  max_energy: 0.35
  # A cut shorter than this is not worth the jump. Below roughly a quarter of a
  # second the viewer only registers the glitch, not the tighter pacing.
  min_removed: 0.25

render:
  # Parallel renders. Without NVENC libx264 is the bottleneck; 4 uses the CPU
  # well without making the machine unusable.
  workers: 4
  encoder: auto            # auto|h264_nvenc|hevc_nvenc|libx264
  crf: 20                  # interpreted as -cq under NVENC
  preset: p5
  fps: 30
  audio_bitrate: 192k
  audio_rate: 48000        # 48k/44.1k are what the platforms expect; see render.py
  loudnorm: true           # to -14 LUFS, the TikTok standard
