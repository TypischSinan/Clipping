name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Only the base and dev dependencies. The cuda extra pulls NVIDIA wheels
      # that are useless on a CPU runner, and nothing in the test suite touches
      # a GPU - device resolution falls back to CPU on its own.
      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check src tests

      - name: Tests
        run: uv run pytest -q
