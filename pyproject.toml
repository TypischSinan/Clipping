[project]
name = "clipper"
version = "0.1.0"
description = "YouTube long-form -> vertical short-form clips. Local pipeline."
requires-python = ">=3.12,<3.13"
dependencies = [
    "yt-dlp>=2025.1.15",
    "faster-whisper>=1.1.0",
    "scenedetect>=0.6.4",
    # headless: we never open a window, and the GUI build needs libGL, which
    # a CI container does not have.
    "opencv-python-headless>=4.10.0",
    "numpy>=1.26,<3",
    "anthropic>=0.40",
    "pydantic>=2.9",
    "typer>=0.15",
    "rich>=13.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
cuda = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
clipper = "clipper.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipper"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# F: pyflakes (unused imports, dead locals), I: import order, UP: modern syntax,
# ARG: unused arguments - genau die Klassen, die stille Karteileichen finden.
select = ["E", "F", "I", "UP", "B", "ARG"]
ignore = [
    "E501",  # line length is the formatter's job, not the linter's
    "B008",  # typer.Option() in a default is Typer's documented pattern
]

[tool.pytest.ini_options]
testpaths = ["tests"]
